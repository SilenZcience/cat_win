name: Compile Binaries

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      bin: ${{ matrix.os == 'macos-latest' && './temp/darwin/catw' || matrix.os == 'windows-latest' && './temp/windows/catw.exe' || './temp/linux/catw' }}
      platform_dir: ${{ matrix.os == 'macos-latest' && 'darwin' || matrix.os == 'windows-latest' && 'windows' || 'linux' }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          ref: 'dev'
      - name: Install Python 3.10
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Update PIP
        run: |
          python -m pip install --upgrade pip
      - name: Setup Compile Dependencies
        run: |
          python -m pip install --upgrade pyinstaller
      - name: Setup Code Dependencies
        run: |
          python -m pip install --upgrade -r ./workflowHelper/requirements.txt
      - name: Setup Version File
        run: |
          python -m workflowHelper.exeversion
      - name: Compile Package
        run: |
          python -m workflowHelper.build
      - name: Test Executable ${{ matrix.os }}
        run: |
          ${{ env.bin }} -h
          ${{ env.bin }} -v
          ${{ env.bin }} -p ${{ env.bin }} -R --debug
      - name: Upload Artifact ${{ env.platform_dir }}
        uses: actions/upload-artifact@v7
        with:
          name: catw-${{ env.platform_dir }}
          path: temp/${{ env.platform_dir }}/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false
      - name: Stamp Filenames with Platform
        run: |
          mkdir out
          for d in artifacts/*/
          do
            plat="${d#artifacts/catw-}"
            plat="${plat%/}"
            for f in "$d"catw* "$d"cats*
            do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              if [[ "$base" == *.exe ]]
              then
                cp "$f" "out/${base%.exe}-${plat}.exe"
              else
                cp "$f" "out/${base}-${plat}"
              fi
            done
          done
          ls -la out
      - name: Attach to latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --json tagName --jq '.tagName')
          gh release upload "$TAG" out/* --clobber
